<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FC Kuhweide – Tag 2: Der Kader</title>
<link rel="stylesheet" href="../engine/node_modules/@fontsource/nunito/800.css">
<link rel="stylesheet" href="../engine/node_modules/@fontsource/nunito/900.css">
<link rel="stylesheet" href="../engine/node_modules/@fontsource/fredoka/600.css">

<link rel="stylesheet" href="../engine/engine.css">
<style>
  :root {
    --navy: #1F2A44; --badge-bg: #E23A4E; --badge-fg: #fff; --banner-bg: #E23A4E; --banner-fg: #fff; --banner-tail: #B52738;
    --banner-size: 104px; --stage-bg: #9BD3F5; --avatar-bg: radial-gradient(circle at 50% 50%, #7CC456, #3E8E36);
    --ticket-accent: #E23A4E; --ticket-kicker: #E23A4E;
  }
  #badge, #title { color: #fff; }
  .card .likes { display: none; }
  .card .lab { font-size: 46px; height: 120px; flex-direction: column; }
  .card .lab small { font-size: 24px; color: #7A8199; margin-top: 6px; }
  .card .icon { font-family: 'Noto Color Emoji'; font-size: 128px; line-height: 150px; height: 150px; }
  /* Taktiktafel */
  #board { position: absolute; left: 60px; top: 220px; width: 960px; height: 1120px; background: #1F2A44; border-radius: 36px;
    border: 7px solid #fff; box-shadow: 0 0 0 6px #1F2A44, 0 18px 0 6px rgba(10,10,30,.35); transform-origin: 50% 40%; }
  #board .head { position: absolute; left: 0; right: 0; top: 14px; text-align: center; font-family: 'Fredoka', 'Noto Color Emoji'; font-weight: 700;
    font-size: 46px; color: #fff; letter-spacing: 2px; }
  #board .pitch { position: absolute; left: 22px; top: 80px; width: 902px; height: 720px; border-radius: 18px; overflow: hidden;
    background: repeating-linear-gradient(0deg, #6DB549 0 74px, #78C152 74px 148px); }
  #board .pitch svg { position: absolute; inset: 0; }
  #board .pos { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #board .jersey { width: 70px; height: 70px; border-radius: 50%; background: #E23A4E; border: 5px solid #fff; box-shadow: 0 0 0 4px #1F2A44;
    color: #fff; font-family: 'Fredoka', 'Noto Color Emoji'; font-weight: 700; font-size: 34px; display: flex; align-items: center; justify-content: center; }
  #board .jersey.gk { background: #FFC83A; color: #1F2A44; font-size: 38px; }
  #board .names { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #board .nm { background: #fff; color: #1F2A44; font-family: 'Nunito', 'Noto Color Emoji'; font-weight: 900; font-size: 25px; padding: 3px 12px 5px;
    border-radius: 12px; border: 3px solid #1F2A44; white-space: nowrap; }
  #board .tagline { font-family: 'Nunito'; font-weight: 900; font-size: 20px; color: #fff; background: #E23A4E; border-radius: 8px; padding: 1px 8px 3px; }
  #board .tagline.duo { background: #2DBE60; }
  #board .tagline.joker { background: #8C5FD9; }
  #board .staff { position: absolute; left: 22px; right: 22px; top: 814px; display: grid; grid-template-columns: 1fr 1fr; gap: 7px 12px; }
  #board .st.wide { grid-column: span 2; }
  #board .st.wide b { display: inline; margin-left: 12px; }
  #board .st { background: #2A3760; border-radius: 14px; padding: 4px 14px 5px; color: #fff; font-family: 'Nunito', 'Noto Color Emoji';
    font-weight: 900; font-size: 18px; line-height: 1.1; }
  #board .st b { display: block; font-size: 21px; color: #FFD43B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #board .glow { box-shadow: 0 0 0 5px #FFD43B, 0 0 30px 10px rgba(255, 212, 59, .8) !important; }
  #board.blurred .nm, #board.blurred .st b { filter: blur(9px); }
  /* Briefumschlag */
  #post { left: 540px; top: 300px; width: 760px; height: 470px; }
  #post .env { position: absolute; inset: 0; border-radius: 22px; background: #FFF6E2; border: 8px solid #1F2A44;
    box-shadow: 0 18px 0 rgba(10,10,30,.35), inset 0 0 0 18px #FFF6E2, inset 0 0 0 30px transparent;
    background-image: repeating-linear-gradient(45deg, #FF7A1A 0 26px, #1F1F1F 26px 52px); }
  #post .env:before { content: ""; position: absolute; inset: 22px; background: #FFF6E2; border-radius: 10px; }
  #post .flap { position: absolute; left: 22px; right: 22px; top: 22px; height: 210px; background: #F3E3BF;
    clip-path: polygon(0 0, 100% 0, 50% 100%); border-bottom: 4px solid #1F2A44; }
  #post .addr { position: absolute; left: 60px; bottom: 50px; font-family: 'Nunito'; color: #1F2A44; }
  #post .addr small { display: block; font-weight: 900; font-size: 24px; letter-spacing: 4px; color: #8A90A6; }
  #post .addr b { display: block; font-family: 'Fredoka'; font-weight: 700; font-size: 46px; line-height: 1.05; margin-bottom: 8px; }
  #post .addr b.to { font-size: 36px; }
  #post .chall { position: absolute; right: 40px; top: 40px; transform: rotate(8deg); font-family: 'Fredoka'; font-weight: 700; font-size: 34px; color: #E8243B;
    border: 6px solid #E8243B; border-radius: 10px; padding: 4px 14px 6px; background: rgba(255,255,255,.85); }
  #post .stampbox { position: absolute; right: 56px; bottom: 60px; width: 110px; height: 130px; border: 5px dashed #1F2A44; border-radius: 8px;
    background: #FFD43B; font-family: 'Noto Color Emoji'; font-size: 64px; display: flex; align-items: center; justify-content: center; }
  #post .seal { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); width: 110px; height: 110px; border-radius: 50%;
    background: #C8202E; border: 6px solid #1F2A44; color: #fff; font-family: 'Fredoka'; font-weight: 700; font-size: 84px;
    display: flex; align-items: center; justify-content: center; }
  /* Antwortbrief */
  #reply { left: 540px; top: 250px; width: 800px; height: 500px; }
  #reply .renv { position: absolute; inset: 0; border-radius: 22px; background: #E8243B; border: 8px solid #1F2A44; box-shadow: 0 18px 0 rgba(10,10,30,.35); overflow: hidden; }
  #reply .renv .flap { position: absolute; left: 0; right: 0; top: 0; height: 240px; background: #C8202E; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  #reply .renv .addr { position: absolute; left: 56px; bottom: 44px; font-family: 'Nunito'; color: #fff; }
  #reply .renv .addr small { display: block; font-weight: 900; font-size: 26px; letter-spacing: 4px; color: #FFD0D5; }
  #reply .renv .addr b { display: block; font-family: 'Fredoka'; font-weight: 700; font-size: 54px; line-height: 1.05; margin: 2px 0 12px; }
  #reply .renv .who { display: inline-block; padding: 6px 10px; border-radius: 12px; }
  #reply.who .renv .who { box-shadow: 0 0 0 5px #FFD43B, 0 0 30px 10px rgba(255, 212, 59, .85); }
  #reply .renv .tag { position: absolute; right: 36px; top: 34px; transform: rotate(8deg); font-family: 'Fredoka'; font-weight: 700; font-size: 40px; color: #fff;
    border: 6px solid #fff; border-radius: 10px; padding: 2px 14px 4px; }
  #reply .renv .q { position: absolute; right: 70px; bottom: 30px; font-family: 'Fredoka'; font-weight: 700; font-size: 190px; line-height: 1; color: #FFD43B;
    -webkit-text-stroke: 8px #1F2A44; paint-order: stroke fill; }
  #reply .bar { display: inline-block; height: .74em; background: #161823; border-radius: 6px; vertical-align: -0.04em; }
  #reply .letter { display: none; position: absolute; left: 0; top: -30px; width: 800px; box-sizing: border-box; background: #FFFDF6; border: 8px solid #1F2A44;
    border-radius: 18px; padding: 30px 44px 30px; box-shadow: 0 18px 0 rgba(10,10,30,.35); font-family: 'Fredoka', 'Noto Color Emoji'; font-weight: 600;
    color: #1F2A44; font-size: 48px; line-height: 1.3; }
  #reply .letter p { margin: 0; }
  #reply .letter .hit { color: #E8243B; font-weight: 700; padding: 0 12px; border: 6px solid #E8243B; border-radius: 50%; }
  #reply.hl .letter .hit { background: #FFE14D; }
  #reply .letter .sig { text-align: right; margin-top: 6px; }
  #reply.open .letter.front { display: block; }
  #reply.open.ps .letter.front { display: none; }
  #reply.open.ps .letter.back { display: block; font-size: 64px; padding: 40px 54px; }
  #crest { left: 540px; top: 230px; width: 560px; height: 640px; }
  #crest .sh { position: absolute; inset: 0 40px 0 40px; background: #6B4A2B; border: 12px solid #1F2A44; border-radius: 30px 30px 50% 50% / 30px 30px 40% 40%;
    box-shadow: inset 0 0 0 14px #A27648, 0 20px 0 rgba(10,10,30,.35); text-align: center; color: #fff; font-family: 'Fredoka'; font-weight: 700;
    background-image: radial-gradient(circle at 30% 70%, #4A3220 0 40px, transparent 41px), radial-gradient(circle at 72% 82%, #4A3220 0 28px, transparent 29px); }
  #crest .sv { font-size: 120px; margin-top: 46px; color: #FFD43B; -webkit-text-stroke: 6px #1F2A44; paint-order: stroke fill; }
  #crest .nm { font-size: 78px; line-height: .95; -webkit-text-stroke: 5px #1F2A44; paint-order: stroke fill; }
  #crest .yr { font-family: 'Nunito'; font-weight: 900; font-size: 30px; letter-spacing: 4px; margin-top: 24px; color: #E8D2B0; }
  #crest .stamp { position: absolute; left: 20px; right: 20px; bottom: 120px; text-align: center; font-family: 'Fredoka'; font-weight: 700; font-size: 84px;
    color: #E8243B; border: 10px solid #E8243B; border-radius: 16px; background: rgba(255,255,255,.88); }
  #reply.open .renv { display: none; }
  /* Zwischentitel */
  #timecard { left: 0; top: 0; width: 1080px; height: 1920px; background: radial-gradient(circle at 50% 45%, #FFE680 0, #FFC83A 55%, #EFA017 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #timecard .clk { font-family: 'Noto Color Emoji'; font-size: 230px; line-height: 1; }
  #timecard .txt { font-family: 'Fredoka'; font-weight: 700; font-size: 128px; line-height: 1.02; color: #fff; -webkit-text-stroke: 12px #1F2A44;
    paint-order: stroke fill; text-align: center; transform: rotate(-4deg); margin-top: 40px; }
  /* Abspann */
  #endcard { left: 540px; top: 380px; width: 860px; box-sizing: border-box; background: rgba(18, 18, 26, .96); border-radius: 40px; padding: 30px 40px 44px;
    color: #fff; text-align: center; font-family: 'Nunito', 'Noto Color Emoji'; box-shadow: 0 16px 0 rgba(0,0,0,.28); }
  #endcard .av { width: 200px; height: 200px; margin: -130px auto 14px; border-radius: 50%; padding: 8px; box-sizing: border-box;
    background: conic-gradient(#25F4EE, #FE2C55, #FFC83A, #25F4EE); }
  #endcard .av img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  #endcard .k { font-weight: 900; font-size: 34px; color: #9AA0B4; letter-spacing: 8px; }
  #endcard .big { font-family: 'Fredoka'; font-weight: 700; font-size: 150px; line-height: 1; color: #FFD43B; margin: 6px 0 4px; }
  #endcard .when { font-weight: 900; font-size: 58px; }
  #endcard .btn { margin: 34px auto 0; width: 560px; font-weight: 900; font-size: 52px; padding: 22px 0 26px; border-radius: 20px; background: #FE2C55; }
  #endcard .btn.done { background: #2A2A35; }
  #endHand { left: 0; top: 0; font-family: 'Noto Color Emoji'; font-size: 130px; transform-origin: 30% 10%; }
  .rstamp { background: #2DBE60; color: #fff; font-family: 'Fredoka'; font-weight: 700; font-size: 36px; line-height: 1; padding: 8px 18px 10px;
    border-radius: 14px; border: 5px solid #1F2A44; box-shadow: 0 7px 0 rgba(10, 10, 30, .3); white-space: nowrap; letter-spacing: 1px; }
  #reply.date .letter b:first-child { background: #FFE14D; border-radius: 10px; padding: 0 8px; }
  #light { background: radial-gradient(circle at 92% 2%, rgba(255, 246, 200, .50) 0, rgba(255, 232, 150, .20) 20%, rgba(255, 232, 150, 0) 46%),
    linear-gradient(to top, rgba(8, 40, 18, .30) 0, rgba(8, 40, 18, 0) 26%); pointer-events: none; }
  #lupe { position: absolute; font-family: 'Noto Color Emoji'; font-size: 190px; left: 0; top: 0; transform-origin: 40% 40%; }
</style>
